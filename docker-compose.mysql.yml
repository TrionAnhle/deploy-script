version: '3.8'
services:
  mysql:
    image: mysql
    hostname: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: redislock  
    networks:
      - vps-net
volumes:
  db_data:
networks:
  vps-net:
    external: true